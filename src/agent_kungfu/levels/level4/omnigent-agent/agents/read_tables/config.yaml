spec_version: 1
name: read_tables
description: Propose the single allowlisted action that stages the five Sakila tables.
skills: [polars]
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: auto
    read_paths: ["."]
    write_paths: []
    write_files: []
    allow_network: false
  start_in_scratch: true
executor:
  type: omnigent
  model: ornith-1.5:9b
  auth:
    type: api_key
    api_key: ollama
    base_url: http://localhost:11434/v1
  config:
    harness: codex
prompt: |
  Load the bundled polars skill before reasoning. You are a read-only planner: do not
  execute commands, inspect files, or access the database. Return a proposal for only the
  read_tables host action, with n set to null and the supplied skill digest unchanged.
async: false

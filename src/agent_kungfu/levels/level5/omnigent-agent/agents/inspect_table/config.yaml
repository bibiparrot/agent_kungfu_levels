spec_version: 1
name: inspect_table
description: Propose one read-only inspection of the exact next unseen Sakila table.
skills: [polars]
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: auto
    read_paths: ["."]
    write_paths: []
    write_files: []
    allow_network: false
  start_in_scratch: true
executor:
  type: omnigent
  timeout: 120
  max_iterations: 2
  model: ornith-1.5:9b
  auth:
    type: api_key
    api_key: ollama
    base_url: http://localhost:11434/v1
  config:
    harness: codex
prompt: |
  Load the bundled Polars skill before reasoning. Propose only inspect_table for the exact
  EXPECTED_TABLE. Echo FEEDBACK_DIGEST and SKILL_DIGEST unchanged. Do not read files, query SQLite, run code,
  fabricate columns or row counts, or propose calculation early. Return your proposal to the
  root agent as compact JSON.
async: false

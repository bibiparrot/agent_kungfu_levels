schema_version: 1
level: 2
name: Code Agent
driver: skills-and-code
baseline: ../baseline/baseline.yaml

model:
  interface: openai-compatible
  base_url: http://localhost:11434/v1
  name: ornith-1.5:9b
  adapter: LiteLLM

orchestration:
  sdk: openai-agents
  pattern: manager-as-tools
  leader:
    name: Sakila QA Leader
    instructions: >-
      Call the table reader first, then call the revenue calculator, and finally
      answer from the returned evidence. Never invent rows or calculate in prose.
  specialists:
    - id: table_reader
      name: Sakila Table Read Agent
      exposed_tool: read_sakila_tables
      runtime_tool: load_revenue_tables
    - id: calculator
      name: Sakila Revenue Calculate Agent
      exposed_tool: calculate_category_revenue
      runtime_tool: calculate_category_revenue

tool:
  default_n: 5
  min_n: 1
  max_n: 16

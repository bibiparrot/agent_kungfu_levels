[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-kungfu-levels"
version = "0.1.0"
description = "Ten progressive agent-engineering demos over the Sakila SQLite database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "connectorx>=0.4.5",
  "jinja2>=3.1",
  "langgraph>=1.0",
  "litellm>=1.80",
  "marimo>=0.24,<1",
  "networkx>=3.4",
  "openai-agents[litellm]>=0.20",
  "openai-codex>=0.144",
  "polars>=1.35",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "rdflib>=7.0",
  "typer>=0.15",
]

[project.optional-dependencies]
harness = ["omnigent-client>=0.11"]
eval = ["deepeval>=4.2"]
dev = ["pytest>=8", "ruff>=0.11"]
book = ["jupyter>=1.1", "pypdf>=5"]

[project.scripts]
kungfu-agent = "agent_kungfu.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_kungfu = [
  "levels/baseline/*.yaml",
  "levels/baseline/*.sql",
  "levels/baseline/*.md",
  "levels/baseline/*.png",
  "levels/level*/*.yaml",
  "levels/level*/*.md",
  "levels/level*/*.j2",
  "levels/level*/requirements.txt",
  "levels/level4/omnigent-agent/*.yaml",
  "levels/level4/omnigent-agent/agents/*/*.yaml",
  "levels/level4/polars/*.md",
  "levels/level4/polars/references/*.md",
  "levels/level5/omnigent-agent/*.yaml",
  "levels/level5/omnigent-agent/agents/*/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.marimo.runtime]
pythonpath = [".", "src"]
